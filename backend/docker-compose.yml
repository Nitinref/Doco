services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      - REVERSE_PROXY_HOST=doco-test.duckdns.org
    volumes:
     - /var/run/docker.sock:/var/run/docker.sock
     - ./public:/public
    ports:
      - '8080:8080'
      - '80:80'
    networks:
       - deploy-engine-network
    
networks:
  deploy-engine-network:
    name: deploy-engine-network